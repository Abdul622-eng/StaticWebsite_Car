<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Premium Car Rental</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<header>

<div class="logo">
🚗 CarRental
</div>

<nav>

<a href="#">Home</a>
<a href="#">Cars</a>
<a href="#">Services</a>
<a href="#">About</a>
<a href="#">Contact</a>

</nav>

<button>Book Now</button>

</header>

<!-- Hero -->

<section class="hero">

<div class="overlay"></div>

<div class="hero-content">

<h1>Premium Car Rental</h1>

<p>
Experience luxury, comfort and performance.
Choose from our premium collection.
</p>

</div>

</section>

<!-- Booking -->

<div class="booking-box">

<div>

<label>Pick Up Location</label>

<select>
<option>New York</option>
<option>Los Angeles</option>
<option>Chicago</option>
</select>

</div>

<div>

<label>Return Location</label>

<select>
<option>New York</option>
<option>Los Angeles</option>
<option>Chicago</option>
</select>

</div>

<div>

<label>Pick Up Date</label>

<input type="date">

</div>

<div>

<label>Return Date</label>

<input type="date">

</div>

<button>Search</button>

</div>

<!-- Categories -->

<section class="category">

<h2>Car Category</h2>

<div class="cars">

<div class="card">

<img src="images/mercedes.jpeg">

<h3>Mercedes Benz</h3>

</div>

<div class="card">

<img src="images/audi.jpg">

<h3>Audi</h3>

</div>

<div class="card">

<img src="images/bmw.jpg">

<h3>BMW</h3>

</div>

<div class="card">

<img src="images/porsche.jpg">

<h3>Porsche</h3>

</div>

</div>

</section>

</body>
</html>
